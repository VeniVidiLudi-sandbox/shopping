[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<5.3",
  "gunicorn>=23",
  "psycopg[binary]>=3.2",
  "mozilla-django-oidc>=4.0",
  "whitenoise>=6.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.uv]
package = false
